<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1>Задачи</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск...">
      <select id="searchTag">
        <option value="">Все теги</option>
      </select>
      <input type="date" id="searchDate">
    </div>
  </header>

  <main id="listView">
    <ul id="taskList" class="task-list"></ul>
    <button class="fab" id="addBtn">+</button>
  </main>

  <section id="detailView" class="hidden">
    <button class="back-btn" id="backBtn">← Назад</button>
    <div id="detailContent"></div>
  </section>

  <dialog id="taskModal">
    <form id="taskForm">
      <h2 id="modalTitle">Новая задача</h2>
      <input type="text" id="inputTitle" placeholder="Заголовок" required>
      <textarea id="inputText" placeholder="Описание (необязательно)"></textarea>
      
      <div class="subtask-section">
        <label>Подзадачи:</label>
        <div id="subtaskList"></div>
        <div class="add-subtask">
          <input type="text" id="newSubtask" placeholder="Добавить подзадачу...">
          <button type="button" id="addSubtaskBtn">+</button>
        </div>
      </div>

      <div class="tags-section">
        <label>Теги (через запятую):</label>
        <input type="text" id="inputTags" placeholder="работа, срочное, личное">
      </div>

      <div class="file-section">
        <label>Файлы (макс. 5/день, до 200КБ):</label>
        <input type="file" id="inputFiles" multiple accept="*/*">
        <small id="fileLimitMsg"></small>
      </div>

      <div class="actions">
        <label class="pin-toggle">
          <input type="checkbox" id="inputPin"> Закрепить (макс. 5)
        </label>
        <div class="btn-row">
          <button type="submit" class="btn primary">Сохранить</button>
          <button type="button" class="btn secondary" id="cancelBtn">Отмена</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
