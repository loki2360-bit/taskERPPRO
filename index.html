<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Поэтический Блокнот</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="lock-selection">

    <!-- Экран входа (Пароль) -->
    <div id="auth-screen" class="screen active">
        <div class="auth-box">
            <h1>Вход в архив</h1>
            <p>Введите пароль для доступа к стихам</p>
            <input type="password" id="password-input" placeholder="Пароль">
            <button onclick="checkPassword()">Войти</button>
            <p id="error-msg" style="color: red; display: none;">Неверный пароль</p>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="app-screen" class="screen hidden">
        <header>
            <h2>Мои Стихи</h2>
            <div class="controls">
                <button onclick="createNewPoem()" title="Новое стихотворение">+</button>
                <button onclick="toggleSettings()" title="Настройки и Бэкап">⚙️</button>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Поиск по названию или тексту..." oninput="renderPoems()">
        </div>

        <div id="poems-list" class="poems-grid">
            <!-- Сюда будут добавляться карточки стихов -->
        </div>
    </div>

    <!-- Экран редактора -->
    <div id="editor-screen" class="screen hidden">
        <header>
            <button onclick="closeEditor()" class="back-btn">← Назад</button>
            <button onclick="saveCurrentPoem()" class="save-btn">Сохранить</button>
        </header>
        <div class="editor-container">
            <input type="text" id="poem-title" placeholder="Название стихотворения">
            <textarea id="poem-content" placeholder="Начните писать здесь..."></textarea>
        </div>
    </div>

    <!-- Настройки / Бэкап -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Управление данными</h3>
            <p>Данные хранятся только на этом устройстве. Чтобы не потерять их при очистке браузера, скачайте резервную копию.</p>
            <div class="btn-group">
                <button onclick="exportData()">📥 Скачать резервную копию</button>
                <button onclick="document.getElementById('import-file').click()">📤 Загрузить копию</button>
                <input type="file" id="import-file" style="display: none" onchange="importData(this)" accept=".json">
            </div>
            <button onclick="toggleSettings()" style="margin-top: 20px; background: #ccc;">Закрыть</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Регистрация Service Worker для работы оффлайн
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
